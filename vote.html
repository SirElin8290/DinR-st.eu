<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ta ställning – DinRöst</title><link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="favicon.png"><link rel="stylesheet" href="styles.css"><style>.brand-icon{width:34px;height:34px;border-radius:8px;display:block;object-fit:cover}.vote-page{min-height:calc(100vh - 72px);background:#e7eadb;padding:58px 0 80px}.vote-shell{width:min(820px,calc(100% - 32px));margin:auto}.vote-back{display:inline-block;color:#596248;text-decoration:none;font-size:13px;font-weight:700;margin-bottom:28px}.vote-card{background:#faf9f2;border:1px solid #d2d3c7;border-radius:12px;overflow:hidden;box-shadow:0 12px 38px rgba(41,44,37,.07)}.vote-topic{display:inline-flex;margin-left:30px;padding:11px 18px;border-radius:0 0 8px 8px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:850;background:#c9d5bc}.vote-content{padding:28px 42px 40px}.vote-count{font-size:11px;letter-spacing:.12em;color:#85887c;font-weight:800}.vote-content h1{font-size:clamp(36px,6vw,56px);line-height:1.08;margin:18px 0}.vote-explain{font-size:16px;color:#5d6156;max-width:680px;margin-bottom:34px}.vote-options{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.choice{border:1px solid #b9bdad;background:#f0f1e7;color:#34382f;border-radius:7px;padding:18px 12px;font:inherit;font-weight:800;font-size:16px;cursor:pointer}.choice:hover,.choice.selected{background:#596248;color:white;border-color:#596248}.vote-confirm{margin-top:24px;width:100%;padding:16px;border:0;border-radius:6px;background:#596248;color:white;font:inherit;font-weight:800;cursor:pointer}.vote-confirm:disabled{opacity:.38;cursor:not-allowed}.vote-privacy{margin-top:18px;font-size:11px;color:#7c7f74;text-align:center}.vote-success{padding:48px 42px;text-align:center}.vote-success .check{width:56px;height:56px;border-radius:50%;background:#596248;color:#fff;display:grid;place-items:center;margin:0 auto 22px;font-size:24px}.vote-success h2{margin-bottom:12px}.vote-success p{color:#64685d}.result-mini{margin:28px auto;max-width:520px;text-align:left}.mini-row{display:grid;grid-template-columns:70px 1fr 48px;gap:10px;align-items:center;margin:12px 0}.mini-track{height:16px;background:#dedfd3}.mini-fill{height:100%;background:#707a57}.next-link{display:inline-block;background:#596248;color:white;text-decoration:none;padding:13px 20px;border-radius:5px;font-weight:750}@media(max-width:600px){.vote-page{padding-top:32px}.vote-content{padding:24px 22px 30px}.vote-topic{margin-left:22px}.vote-options{grid-template-columns:1fr}.vote-content h1{font-size:36px}}</style></head><body><header class="site-header"><div class="wrap nav"><a class="brand" href="dashboard.html"><img class="brand-icon" src="favicon.png" alt=""><span>DinRöst</span></a><a class="login" href="index.html">Logga ut</a></div></header><main class="vote-page"><div class="vote-shell"><a class="vote-back" href="dashboard.html#fragor">← Tillbaka till veckans frågor</a><section class="vote-card" id="voteCard"><div class="vote-topic" id="voteTopic">Ämne</div><div class="vote-content"><div class="vote-count" id="voteNumber">VECKANS FRÅGA</div><h1 id="voteQuestion"></h1><p class="vote-explain">Välj det alternativ som bäst motsvarar din uppfattning. Din röst registreras i prototypen på den här enheten.</p><div class="vote-options"><button class="choice" data-value="Ja">Ja</button><button class="choice" data-value="Nej">Nej</button><button class="choice" data-value="Osäker">Osäker</button></div><button class="vote-confirm" id="confirmVote" disabled>Registrera min röst</button><p class="vote-privacy">En person · en röst per fråga · publikt visas endast aggregerade resultat</p></div></section></div></main><script>const questions=[['Energi & klimat','Bör Sverige bygga ny kärnkraft?'],['Skola & utbildning','Bör mobiltelefoner vara förbjudna under hela skoldagen i grundskolan?'],['Vård & omsorg','Bör staten ta ett större ansvar för finansieringen av svensk sjukvård?'],['Lag & trygghet','Bör fler mindre orter ha permanent lokal polisnärvaro?'],['Ekonomi & arbete','Bör Sverige prioritera lägre statsskuld framför nya offentliga investeringar?'],['Demokrati & samhälle','Bör fler nationella sakfrågor avgöras genom rådgivande folkomröstningar?']];const params=new URLSearchParams(location.search);let q=Math.max(0,Math.min(questions.length-1,Number(params.get('q'))||0));voteTopic.textContent=questions[q][0];voteQuestion.textContent=questions[q][1];voteNumber.textContent='FRÅGA '+String(q+1).padStart(2,'0')+' · ÖPPEN';let selected='';document.querySelectorAll('.choice').forEach(btn=>btn.onclick=()=>{selected=btn.dataset.value;document.querySelectorAll('.choice').forEach(x=>x.classList.toggle('selected',x===btn));confirmVote.disabled=false});confirmVote.onclick=()=>{const votes=JSON.parse(localStorage.getItem('dinrost-demo-votes')||'{}');votes[q]=selected;localStorage.setItem('dinrost-demo-votes',JSON.stringify(votes));const result=selected==='Ja'?[58,33,9]:selected==='Nej'?[56,35,9]:[57,33,10];voteCard.innerHTML=`<div class="vote-success"><div class="check">✓</div><span class="kicker">RÖST REGISTRERAD</span><h2>Tack för att du tog ställning.</h2><p>Du svarade <strong>${selected}</strong> på frågan.</p><div class="result-mini"><div class="mini-row"><span>Ja</span><div class="mini-track"><div class="mini-fill" style="width:${result[0]}%"></div></div><strong>${result[0]}%</strong></div><div class="mini-row"><span>Nej</span><div class="mini-track"><div class="mini-fill" style="width:${result[1]}%"></div></div><strong>${result[1]}%</strong></div><div class="mini-row"><span>Osäker</span><div class="mini-track"><div class="mini-fill" style="width:${result[2]}%"></div></div><strong>${result[2]}%</strong></div></div><a class="next-link" href="dashboard.html#fragor">Till veckans frågor</a></div>`};</script></body></html>
